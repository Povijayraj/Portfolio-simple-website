<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">
    <title>contact</title>
</head>
<body>
    <div class="container">
        <div class="one">
            <h1 class="one__title">Vijay</h1>
            <p class="one__desc">Web Developer</p>
            <a href="index.html" class="one__contact">Home</a>
        </div>
        <div class="contact-form">
            <form>
                <table>
                    <tr >
                        <td>Name :</td><td><input type="text" placeholder="Enter your Name" class="contact-form__name"></td>
                    </tr>
                    <tr >
                        <td>Email :</td><td><input type="email" placeholder="Enter your Email" class="contact-form__email"></td>
                    </tr>
                    <tr >
                        <td>Message :</td><td><textarea placeholder="Message" class="contact-form__textarea"></textarea></td>

                    </tr>
                    <tr>
                        <td></td><td><input type="submit" class="contact-form__submit"></td>
                    </tr>
                </table>
                </form>
                <div class="five">
            <p class="five__desc">Social Media:
                <a href="https://www.instagram.com/accounts/login/?hl=en">Instagram</a> ,
                <a href="https://www.linkedin.com/?trk=guest_homepage-jobseeker_nav-header-logo">LinkedIn</a>
            </p>
            <p class="five__name">&copy; Vijay</p>
        </div>
</body>
</html>
